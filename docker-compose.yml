services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rlhf_seg
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Dev 1 — Grounding DINO + SAM2 (5x MCD) auto-labeling
  pre_inference:
    build: ./services/pre_inference
    env_file: .env
    ports: ["8001:8001"]
    depends_on: [postgres]
    volumes:
      - ./services/pre_inference:/app
      - ./models:/app/models

  # Dev 2 — Dual-metric router, honeypot injection, trust scores
  routing_qa:
    build: ./services/routing_qa
    env_file: .env
    ports: ["8002:8002"]
    depends_on: [postgres, redis]
    volumes:
      - ./services/routing_qa:/app

  # Dev 3 — Label Studio ML Backend (stochastic SAM2 decoder)
  serving_ui:
    build:
      # Repo root, NOT ./services/serving_ui: the image needs common/schemas
      # alongside the service code. See services/serving_ui/Dockerfile.
      context: .
      dockerfile: services/serving_ui/Dockerfile
    env_file: .env
    ports: ["8003:8003"]
    depends_on: [routing_qa]
    volumes:
      - ./services/serving_ui/app:/app/app
      - ./services/serving_ui/label_studio:/app/label_studio
      - ./common:/app/common
      - ./tests/mocks:/app/tests/mocks
      # Local test images only. NOT ./tests - that holds the Label Studio API
      # token during local setup.
      - ./tests/assets:/app/tests/assets:ro
      # The served-wiggle store must outlive the container: it is the only
      # persisted record of the sampled action A_t. See app/store.py.
      - served_wiggles:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8003/health',timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  label_studio:
    image: heartexlabs/label-studio:latest
    # :8080 stays published so it does not break anyone else's workflow, BUT
    # annotating via :8080 captures NO effort telemetry - the instrumentation
    # script is injected by ls_proxy on :8081. Use :8081 for real annotation.
    ports: ["8080:8080"]
    environment:
      LABEL_STUDIO_ML_BACKEND_V2: "true"
      LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED: "true"
      CSRF_TRUSTED_ORIGINS: "http://localhost:8081,http://127.0.0.1:8081"
    volumes:
      - ls_data:/label-studio/data
    depends_on: [serving_ui]

  # Dev 3 — injects the effort-telemetry instrumentation into Label Studio's
  # page. Community Label Studio has no custom-JS setting, so the script tag is
  # added by a reverse proxy. Annotate via http://localhost:8081.
  ls_proxy:
    image: nginx:1.27-alpine
    ports: ["8081:8081"]
    volumes:
      - ./infra/nginx/label_studio_proxy.conf:/etc/nginx/templates/label_studio_proxy.conf.template:ro
    environment:
      NGINX_ENVSUBST_FILTER: "RLHF_"
      RLHF_TELEMETRY_ENDPOINT: "${RLHF_TELEMETRY_ENDPOINT:-http://localhost:8003/telemetry/raw}"
      RLHF_TELEMETRY_SCRIPT_URL: "${RLHF_TELEMETRY_SCRIPT_URL:-http://localhost:8003/static/effort_telemetry.js}"
      RLHF_TELEMETRY_TRANSPORT: "${TELEMETRY_TRANSPORT:-beacon}"
      RLHF_TELEMETRY_DEBUG: "${RLHF_TELEMETRY_DEBUG:-false}"
    depends_on: [label_studio, serving_ui]

  # Dev 4 — Webhook gateway + Redis ingestion + stub telemetry worker
  webhook_gateway:
    build: ./services/webhook_gateway
    env_file: .env
    ports: ["8004:8004"]
    depends_on: [redis, postgres]
    volumes:
      - ./services/webhook_gateway:/app
      - ./common:/app/common

  # Tier 3 — reward pipeline. Dev 1 owns the Redis consumer half, Dev 2 the
  # reward half (`stage2.process_stage1`).
  #
  # Behind a profile on purpose: the default CMD is Dev 1's consumer entrypoint,
  # which does not exist yet, so an unprofiled service would crash-loop for
  # everyone running `docker compose up`. Drop the `profiles` key once
  # `tier3_worker/consumer.py` lands.
  #
  #   docker compose --profile tier3 up -d --build tier3_worker
  #   docker compose run --rm tier3_worker python -m tier3_worker.selfcheck
  tier3_worker:
    profiles: ["tier3"]
    build:
      # Repo root, NOT ./services/tier3_worker: the image needs common/schemas
      # and infra/sql. See services/tier3_worker/Dockerfile.
      context: .
      dockerfile: services/tier3_worker/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # The compose Postgres, which is not what .env.example's DATABASE_URL
      # points at. Explicit here so the worker talks to the local stack.
      TIER3_PG_DSN: "${TIER3_PG_DSN:-postgresql://user:password@postgres:5432/rlhf_seg}"
      # Q11 / D10 is unresolved: reward attributes to the sampled action by
      # default. Set to `initial` to measure against the consensus mask instead.
      TIER3_REFERENCE_MASK: "${TIER3_REFERENCE_MASK:-wiggled}"
      # PROVISIONAL. The source documents never assign alpha or beta — see
      # docs/reference/equations.md. Calibrate before trusting a run.
      TIER3_ALPHA: "${TIER3_ALPHA:-1.0}"
      TIER3_BETA: "${TIER3_BETA:-0.3}"
    volumes:
      - ./services/tier3_worker:/app/tier3_worker
      - ./common:/app/common
      - ./infra/sql:/app/infra/sql:ro

volumes:
  pgdata:
  ls_data:
  served_wiggles:

  tier4_worker:
    build:
      context: .
      dockerfile: services/tier4_worker/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/tier4_worker:/app/tier4_worker
      - ./common:/app/common
      - ./models:/app/models
