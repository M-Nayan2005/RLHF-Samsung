# Label Studio reverse proxy with instrumentation injection.
#
# The problem this solves: the effort telemetry has to be captured in the
# browser, and community Label Studio has no supported way to add a script to
# its page. (Enterprise has a custom-JS setting; the OSS image does not.) The
# options are to fork and rebuild the frontend bundle, to ask every annotator to
# install a userscript, or to inject the tag in front of the app. Injection is
# the only one of the three that is a deployment concern rather than a
# per-annotator chore, so that is what this does.
#
# `sub_filter` rewrites the closing </head> in Label Studio's HTML to carry the
# config object and the script tag. Everything else passes through untouched.
#
# Annotators then use http://localhost:8081 instead of :8080. Point them at the
# wrong port and everything works except the telemetry, which is the failure
# mode worth guarding against - see the health check note at the bottom.

# This file is mounted as /etc/nginx/templates/*.conf.template, so the official
# image runs envsubst over it and drops the result into conf.d — which is inside
# the `http` block, where `map` and `upstream` are legal.
#
# NGINX_ENVSUBST_FILTER=RLHF_ is set in docker-compose.yml so envsubst only
# touches ${RLHF_*}. Without that filter it would also eat nginx's own $host,
# $remote_addr and friends, and the proxy would come up subtly broken.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream label_studio_upstream {
    server label_studio:8080;
}

server {
    listen 8081;
    server_name _;

    # Label Studio uploads images and exports datasets; the default 1m is not
    # enough and the failure looks like a hung UI.
    client_max_body_size 512m;

    # ------------------------------------------------------------------
    # WebSocket-capable proxy pass
    # ------------------------------------------------------------------
    location / {
        proxy_pass http://label_studio_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host:$server_port;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # `sub_filter` cannot rewrite a compressed response body, and Label
        # Studio will happily gzip its HTML if we advertise support for it.
        proxy_set_header Accept-Encoding "";

        # ------------------------------------------------------------------
        # The injection
        # ------------------------------------------------------------------
        # RLHF_TELEMETRY_ENDPOINT and RLHF_TELEMETRY_TRANSPORT are substituted
        # from the environment by the entrypoint (see docker-compose.yml), so
        # the same config file works for local dev and a deployed host.
        sub_filter_once on;
        sub_filter_types text/html;
        sub_filter '</head>'
'<script>window.RLHF_TELEMETRY_CONFIG={endpoint:"${RLHF_TELEMETRY_ENDPOINT}",transport:"${RLHF_TELEMETRY_TRANSPORT}",boundaryPx:24,debug:${RLHF_TELEMETRY_DEBUG}};</script>
<script src="${RLHF_TELEMETRY_SCRIPT_URL}" defer></script>
</head>';
    }

    # ------------------------------------------------------------------
    # Injection health check
    # ------------------------------------------------------------------
    # Curl this after bringing the stack up. If it does not print the script
    # tag, the telemetry is silently not being captured and every annotation
    # collected through this proxy will reach Tier 3 with no effort terms:
    #
    #   curl -s http://localhost:8081/ | grep -o 'effort_telemetry.js'
    #
    # An empty result is a failed deployment even though every service is green.
    location = /_injection_check {
        default_type text/plain;
        return 200 "proxy up; check the injection with: curl -s http://localhost:8081/ | grep effort_telemetry.js\n";
    }
}
