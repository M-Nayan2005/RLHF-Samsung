[pytest]
# Track-local on purpose: a pytest.ini at the repo root would set testpaths for
# every developer's suite, not just this one.
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers

# The frozen contracts use Pydantic v1 constraint spellings (`min_items`,
# class-based `Config`) under a v2 pin. That is divergence D8 in
# docs/implementation/spec-alignment.md — a known deprecation, not a break, and
# NOT this track's to fix: a schema change needs its own PR reviewed by the
# downstream consumer. Silenced here so a real warning is not lost in the noise.
filterwarnings =
    ignore:`min_items` is deprecated.*:DeprecationWarning
    ignore:`max_items` is deprecated.*:DeprecationWarning
    ignore:Support for class-based `config` is deprecated.*:DeprecationWarning
